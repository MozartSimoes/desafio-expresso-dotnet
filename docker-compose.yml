# Local development only: these credentials are not secrets.
services:
  postgres:
    image: postgres:17
    environment:
      POSTGRES_DB: expresso
      POSTGRES_USER: expresso
      POSTGRES_PASSWORD: expresso
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U expresso"]
      interval: 5s
      retries: 10

  api:
    build: .
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      ConnectionStrings__Expresso: "Host=postgres;Port=5432;Database=expresso;Username=expresso;Password=expresso"
      # Simulated fiscal emitter: 1 = always down, 0 = never fails.
      FiscalEmitter__FailureRate: "0.3"
      FiscalEmitter__DelayMilliseconds: "1500"
    ports:
      - "8080:8080"

  # Blazor screens for the counter; they talk to the API inside the Docker network.
  web:
    build:
      context: .
      dockerfile: src/Expresso.Web/Dockerfile
    depends_on:
      - api
    environment:
      Api__BaseUrl: "http://api:8080/"
    ports:
      - "8081:8080"

volumes:
  pgdata:
