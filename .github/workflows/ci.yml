name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Restore
        run: dotnet restore

      - name: Build
        run: dotnet build --no-restore -c Release

      # Integration tests start PostgreSQL with Testcontainers; the runner already has Docker.
      - name: Test
        run: dotnet test --no-build -c Release --logger "console;verbosity=normal"

  docker-image:
    runs-on: ubuntu-latest
    needs: build-and-test
    steps:
      - uses: actions/checkout@v4
      - name: Build API image
        run: docker build -t expresso-api .
      - name: Build web image
        run: docker build -t expresso-web -f src/Expresso.Web/Dockerfile .
